[workspace]

[package]
name = "mssql-ingest"
version = "0.1.0"
edition = "2021"
publish = false
description = "MSSQL ingest service (Rust / axum / tiberius)"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.13.0", default-features = false, features = ["chrono", "tds80", "rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
