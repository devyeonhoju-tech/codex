[workspace]
resolver = "2"
members = ["rust-service", "bench"]

# Release settings used for the published benchmark binaries.
# Thin LTO and a single codegen unit are ordinary production choices.
# target-cpu=native is intentionally not set: aes-gcm detects AES-NI at runtime.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
