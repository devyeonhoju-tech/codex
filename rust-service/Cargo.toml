[package]
name = "rust-service"
version = "0.1.0"
edition = "2021"
publish = false
description = "AES-256-GCM JSON benchmark service (Rust / axum)"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
cpufeatures = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
